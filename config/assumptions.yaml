# =============================================================================
# RHNA-Climate — tunable assumptions for the climate adjustment model
# -----------------------------------------------------------------------------
# EVERY assumption-laden parameter lives here so the model is auditable and the
# sensitivity analysis (src/sensitivity.py) can sweep the uncertain ones.
# Values are deliberately CONSERVATIVE (low-end) — the goal is a "probable
# MINIMUM", i.e. a defensible floor, not a central or worst-case forecast.
# =============================================================================

scenario:
  ssp: ssp245            # CMIP6 emissions scenario (SSP2-4.5)
  decade: "2050s"        # horizon decade used for the climate multiplier
  cmip6_baseline: "1981-2010"

horizon:
  # Years of climate exposure accumulated into replacement need. The 6th cycle
  # is ~8 years; we extend to the mid-century planning horizon the adjusted
  # allocation is meant to anticipate. Swept in sensitivity.
  years: 8
  years_sensitivity: [8, 16, 30]

# ---- Hazard exposure index E_j (0..1) ---------------------------------------
# Weighted blend of normalized hazard components; weights are renormalized to
# sum to 1. Each component is in [0,1]:
#   fire  = NRI wildfire risk percentile (WFIR_RISKS/100)
#   flood = max(inland, coastal) NRI flood risk percentile /100
#   heat  = NRI heat-wave risk percentile (HWAV_RISKS/100)
#   slr   = normalized projected sea-level rise at nearest gauge (coastal only)
exposure:
  weights:
    fire: 0.40
    flood: 0.30
    heat: 0.15
    slr: 0.15
  # Coastal classification: a jurisdiction is "coastal" if its centroid is
  # within this distance of a NOAA SLR gauge.
  coastal_km: 25
  # SLR scenario + year used for the coastal exposure signal (OPC planning std).
  slr_scenario: intermediate
  slr_year: "2050"
  # Normalization cap: SLR (in cm) mapped linearly onto [0,1] up to this cap.
  slr_norm_cm: 60

# ---- Component A: replacement need (raises the statewide total) --------------
replacement:
  # Which FEMA NRI building expected-annual-loss (EAL) hazards feed replacement.
  hazards: [wfir, cfld, ifld]     # wildfire, coastal flood, inland flood
  # NRI EAL is an annualized *dollar* loss. Converting to destroyed HOUSING
  # UNITS requires a value-per-unit assumption. We instead use the building
  # EAL *rate* (EAL / building exposure value) as an annual fractional loss of
  # the building stock, then apply it to occupied housing units. This factor
  # scales that rate to reflect that residential unit loss ~ tracks building
  # value loss. Conservative default = 1.0 (no amplification).
  eal_to_unit_loss_factor: 1.0
  # Cap the annual per-jurisdiction loss rate so a single extreme tract cannot
  # produce implausible replacement counts.
  max_annual_loss_rate: 0.02      # 2%/yr ceiling
  # CMIP6 future multiplier: how much the historical NRI loss rate is scaled up
  # by projected mid-century intensification. Built from normalized SSP2-4.5
  # signals (dry-spell/heat -> fire; extreme-precip -> flood). These weights map
  # a 0..1 normalized climate signal onto a multiplier in [1, 1+max_uplift].
  climate_uplift:
    max_uplift: 0.5               # up to +50% over historical at signal=1.0
    fire_signal_weight: 0.6       # weight on max_dry_spell + tasmax_peak_f
    flood_signal_weight: 0.4      # weight on extreme_precip_days

# ---- Component B: out-displacement (redistributes) --------------------------
displacement:
  # Exposure index E_j in [0,1] maps to a displacement fraction of population
  # over the horizon via a threshold-relative power curve:
  #   e = clip((E_j - min_exposure) / (1 - min_exposure), 0, 1)
  #   frac = max_fraction * e ** exponent
  # => 0 below the threshold, max_fraction at E_j = 1. Convex (exponent>1) so
  # only the most-exposed places shed meaningful population.
  max_fraction: 0.10              # at most 10% of pop displaced over horizon
  exponent: 2.0
  # Exposure threshold below which no displacement occurs (avoids penalizing
  # low-risk places for noise).
  min_exposure: 0.5
  # Swept in sensitivity.
  max_fraction_sensitivity: [0.05, 0.10, 0.20]
  exponent_sensitivity: [1.5, 2.0, 3.0]

# ---- Component C: receiver capture (redistributes) --------------------------
receiver:
  # Displaced pool is distributed to jurisdictions weighted by
  #   weight_j = ((1 - E_j) ** resilience_exponent) * (capacity_j ** capacity_exponent)
  # capacity proxy = existing population (jobs proxy unavailable statewide).
  resilience_exponent: 1.5
  capacity_exponent: 1.0
  # Receivers must be below this exposure to be eligible at all.
  max_exposure_eligible: 0.5

# ---- Component D: siting discount (redistributes unsafe capacity) -----------
siting:
  # Share of a jurisdiction's baseline RHNA assumed to fall in "unsafe" tracts,
  # estimated from the fraction of its tracts that are very-high hazard.
  # A tract is "unsafe" if its NRI wildfire OR flood rating percentile >=
  # unsafe_percentile, or it is SLR-inundated (coastal).
  unsafe_percentile: 0.90
  # Only this fraction of the theoretically-unsafe share is actually moved
  # (some infill/retrofit remains feasible) — conservative.
  move_fraction: 0.5

# ---- Household conversion ----------------------------------------------------
household:
  avg_size: 2.9                   # CA avg household size (persons/household)

# ---- Longer-horizon trajectory (src/trajectory.py) --------------------------
# Projects housing need DECADE-BY-DECADE beyond the 6th cycle, with time-varying
# climate (CMIP6 decade + rising SLR) layered on a growing baseline. Each decade
# ~ one 8-10 yr planning cycle; the 2030s (7th-cycle era) is normalized to the
# 6th-cycle magnitude so the trajectory is anchored to HCD's actual numbers.
trajectory:
  decades: ["2030s", "2040s", "2050s", "2060s", "2070s", "2080s", "2090s"]
  years_per_decade: 10
  # Source of the per-decade baseline (climate-blind) growth multiplier:
  #   county    -> DOF P-2A county population projections (src/dof_projections.py)
  #                give each county its own trajectory (RECOMMENDED, real data).
  #   statewide -> the uniform baseline_growth_mult curve below (fallback / for
  #                comparison in the trajectory sensitivity).
  growth_source: county
  # Growth share of an RHNA allocation (the rest addresses the existing deficit
  # and persists regardless of demographics). Only this share scales with DOF
  # household growth. Mirrors stock_growth_fraction.
  need_growth_share: 0.65
  # County multipliers are relative to each county's own 2020s growth; bound them:
  county_growth_floor: 0.25   # a flat/declining county still needs ~25% of pace
  county_growth_cap: 2.0      # cap runaway high-growth counties
  # Only part of an RHNA allocation is net-new stock; the rest addresses the
  # EXISTING deficit (overcrowding, cost burden, vacancy shortfall) and does not
  # physically enlarge the housing stock. Grow the stock (which drives future
  # replacement need) by only this growth-component fraction of each decade's
  # baseline need. ~0.65 reflects the growth share of the 6th-cycle determination.
  stock_growth_fraction: 0.65
  # Baseline (climate-BLIND) housing-need per decade as a multiplier on each
  # jurisdiction's 6th-cycle allocation. 2030s = 1.0 (reference).
  # DOF-informed shape: CA population is projected to plateau in the mid-2040s
  # and then slowly decline, BUT household formation continues (household size
  # keeps falling), so need tapers gradually rather than collapsing. This is a
  # documented statewide assumption applied uniformly; replace with county-level
  # DOF household projections for geographic differentiation (see FUTURE_WORK).
  baseline_growth_mult:
    "2030s": 1.00
    "2040s": 0.95
    "2050s": 0.88
    "2060s": 0.80
    "2070s": 0.72
    "2080s": 0.66
    "2090s": 0.60
  # Sensitivity: a flat (no-taper) vs a steeper-decline household-growth path.
  baseline_growth_variants:
    flat:    {"2030s": 1.0, "2040s": 1.0, "2050s": 1.0, "2060s": 1.0, "2070s": 1.0, "2080s": 1.0, "2090s": 1.0}
    decline: {"2030s": 1.0, "2040s": 0.9, "2050s": 0.78, "2060s": 0.65, "2070s": 0.55, "2080s": 0.45, "2090s": 0.38}

# ---- Component E: water-siting discount (supply-side; redistributes) --------
# Water constrains WHERE housing can be built, not how much is needed. A share of
# a water-constrained jurisdiction's allocation is treated as not-probable-to-be-
# watered and moved into the redistribution pool; water-stressed places are also
# down-weighted as receivers. Purely redistributive -> statewide total unchanged.
water:
  enabled: true
  # W_j = weighted blend (renormalized) of SGMA basin priority/overdraft, NRI
  # drought risk, and CMIP6 aridification (dry spell + drier precip).
  weights:
    sgma: 0.40
    drought: 0.35
    aridification: 0.25
  siting:
    # No discount below this stress; convex ramp to max_move_fraction at W=1.
    min_stress: 0.55
    max_move_fraction: 0.25
    exponent: 1.5
  receiver:
    # Receiver weight multiplied by water headroom (1 - W) ** this exponent.
    # Kept MODEST (0.5): W_j is a groundwater-overdraft + drought index and does
    # NOT capture imported-supply risk (Colorado River / SWP cuts), so it
    # overstates how "water-secure" the coastal metros (LA/SF/SD) are as
    # receivers. The robust water signal is the siting discount OUT of
    # overdrafted basins; the receiver side is deliberately soft. See
    # methodology §8 (imported-supply limitation).
    headroom_exponent: 0.5

# ---- Heat-habitability index H_j (src/heat.py) ------------------------------
# Chronic extreme-heat livability, DISTINCT from the acute NRI heat-wave term
# already in E_j (uses warm nights / cooling burden / AC gap, not hwav). Feeds
# the compound-constraint view only — NOT a discount component (would double-
# count heat against E_j).
heat:
  weights:
    warm_nights: 0.35
    cdd_65f: 0.30
    tasmax_peak_f: 0.20
    ac_gap: 0.15

# ---- Compound climate-constraint view (src/constraints.py) ------------------
# Flags each DISTINCT hazard axis once, so nothing is double-counted:
#   fire/flood/slr  <- exposure sub-scores (NRI wfir / ifld+cfld / SLR)
#   water           <- W_j (SGMA overdraft + drought + aridification)
#   heat            <- H_j (heat-habitability; NRI hwav is NOT re-counted here)
# A jurisdiction is "constrained" on an axis if its score exceeds the threshold.
constraints:
  # Per-axis cutoffs identify the genuinely-high tail for THAT hazard; they are
  # not directly comparable across axes. Fire/flood use the 90th-percentile
  # "very high" cutoff (matching the model's siting unsafe_percentile) because CA
  # skews high on national NRI percentiles — a lower cutoff would flag half the
  # state on flood alone. Water/heat are indices (mean ~0.3), so 0.55 is their
  # elevated tail.
  thresholds:
    fire: 0.90      # NRI wildfire percentile /100 (very high)
    flood: 0.90     # NRI inland/coastal flood percentile /100 (very high)
    slr: 0.40       # normalized sea-level-rise exposure (~24 cm+)
    water: 0.55     # water-stress index W_j
    heat: 0.55      # heat-habitability index H_j

# ---- Compound model (option 2, shown as a SECOND model) ---------------------
# The base model treats hazards independently. This OPTIONAL second model adds a
# compound effect: jurisdictions stacking multiple climate constraints
# (n_constraints >= min_stack) shed EXTRA capacity, of which only rehouse_fraction
# can be absorbed by climate-safe receivers — the rest is STRANDED (California may
# lack enough safe/water-secure/heat-livable land to rehouse everyone), lowering
# the statewide probable minimum BELOW the base. Presented alongside the base as
# a scenario, because compounding is genuinely uncertain (option 3 — explicit
# physical couplings — is the eventual more rigorous approach).
compound:
  enabled: true
  min_stack: 2            # only places stacking >= this many hazard axes
  rate: 0.15             # extra share of B moved out per stacked axis beyond min
  exponent: 1.0
  rehouse_fraction: 0.5   # fraction of compound-displaced capacity that finds a
                          # safe home; (1 - this) is stranded (lost from total)
  # Swept to present a band (compounding strength is uncertain).
  rate_sensitivity: [0.10, 0.15, 0.25]
  rehouse_sensitivity: [0.25, 0.50, 0.75]

# ---- External in-migration (optional additive term) -------------------------
# Net climate in-migration to CA from out of state is highly uncertain; default
# OFF so the statewide increase is driven only by in-state replacement need.
external_migration:
  enabled: false
  net_households: 0
